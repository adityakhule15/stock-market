services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      - RUN_EMBEDDED_SCHEDULER=1
      - TRADINGAGENTS_NO_UPDATE_CHECK=1
      - TRADINGAGENTS_RESULTS_DIR=/app/artifacts/research
      - TRADINGAGENTS_CACHE_DIR=/app/data/tradingagents/cache
      - TRADINGAGENTS_MEMORY_LOG_PATH=/app/data/tradingagents/memory/trading_memory.md
      - TA_PYTHON=/usr/local/bin/python
      - TA_RUNNER=/app/scripts/ta_runner.py
      - KRONOS_PYTHON=/usr/local/bin/python
      - KRONOS_RUNNER=/app/scripts/kronos_runner.py
      - HF_HUB_DISABLE_TELEMETRY=1
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./scripts:/app/scripts:ro
      - ./third_party:/app/third_party:ro

  research-agents:
    build:
      context: .
      dockerfile: Dockerfile.research
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_NO_UPDATE_CHECK=1
      - TRADINGAGENTS_RESULTS_DIR=/app/artifacts/research
      - TRADINGAGENTS_CACHE_DIR=/app/data/tradingagents/cache
      - TRADINGAGENTS_MEMORY_LOG_PATH=/app/data/tradingagents/memory/trading_memory.md
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    # Idle sidecar: Django web invokes scripts/ta_runner.py via host/shared volume
    # or `docker compose run --rm research-agents` for CLI parity.
    entrypoint: ["sleep", "infinity"]
    profiles:
      - agents

  kronos:
    build:
      context: .
      dockerfile: Dockerfile.kronos
    env_file:
      - .env
    environment:
      - HF_HUB_DISABLE_TELEMETRY=1
      - HF_HOME=/app/data/kronos/hf_cache
      - HUGGINGFACE_HUB_CACHE=/app/data/kronos/hf_cache
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./third_party/kronos:/app/third_party/kronos:ro
      - ./scripts/kronos_runner.py:/app/scripts/kronos_runner.py:ro
    entrypoint: ["sleep", "infinity"]
    profiles:
      - kronos
