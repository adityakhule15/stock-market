{% extends "dashboard/base.html" %}
{% load static %}
{% block title %}Today — StockScope{% endblock %}
{% block content %}
<h1>Today</h1>
<p class="muted">Ranked ideas that fit your wallet after Groww charges. You place every order yourself.</p>

<div class="tabs" id="board-tabs">
  <button type="button" data-tab="all" class="active">All</button>
  <button type="button" data-tab="normal">Stocks</button>
  <button type="button" data-tab="fno">Options</button>
</div>

<div class="row" style="margin-bottom:0.75rem">
  <button type="button" id="btn-scan">Scan now</button>
  <button type="button" id="btn-tomorrow" class="secondary">Buy for tomorrow</button>
  <span id="scan-status" class="muted"></span>
</div>

<div id="signals"
     hx-get="{% url 'signals_partial' %}?tab=all"
     hx-trigger="load"
     hx-swap="innerHTML">
  <div class="card muted">Loading…</div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'dashboard/today.js' %}"></script>
<script>
window.SS_CSRF = '{{ csrf_token }}';
</script>
{% endblock %}
